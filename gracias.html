<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Gracias por tu Compra!</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f7f6;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            max-width: 500px;
            padding: 2rem 3rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 { color: #28a745; }
        a {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 12px 24px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        a:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>¡Compra Recibida!</h1>
        <p>¡Muchas gracias por participar! Hemos recibido tu pedido.</p>
        <p>En breve, revisaremos tu comprobante y te contactaremos por WhatsApp.</p>
        <p><strong>¡Mucha suerte en el juego!</strong></p>
        <a href="/">Volver a la página principal</a>
    </div>
    <script>
        localStorage.removeItem('bingoCarritoLocal');
    </script>

</html>
